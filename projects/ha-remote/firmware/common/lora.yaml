# Link: one LoRa packet to an always-on gateway (gateway.yaml). Awake ~0.45 s per
# press instead of ~3 s, and no Wi-Fi to join. Packet, 6 bytes:
#   0xA5, remote id, button, battery mV high, battery mV low, sequence
# Not encrypted or signed: anyone with a LoRa radio nearby could replay a press.

globals:
  - id: seq
    type: uint8_t
    restore_value: true
    initial_value: "0"

script:
  # No acknowledgement comes back, so feedback means "sent", not "received".
  - id: send_press
    mode: single
    then:
      - lambda: |-
          uint16_t mv = (uint16_t) (id(vbat).state * 1000.0f);
          id(seq) += 1;
          id(radio).transmit_packet({0xA5, ${remote_id}, (uint8_t) id(sending),
                                     (uint8_t) (mv >> 8), (uint8_t) (mv & 0xFF), id(seq)});
      - script.execute: feedback_ok
      - delay: 200ms
