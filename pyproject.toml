[project]
name = "modelkit"
version = "0.1.0"
description = "Shared CAD / physics / export helpers for the modeling workspace"
requires-python = ">=3.11,<3.13"
dependencies = [
    "build123d>=0.9",
    "numpy>=2",
    "scipy>=1.13",
    "pyyaml>=6",
]

[project.scripts]
modelkit = "modelkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/modelkit"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
